name: Release

# Dispara ao empurrar uma tag de versão: v0.1.1, v1.0.0, v0.2.0-beta.1 ...
# A TAG é a fonte da verdade da versão (o VersionPrefix do src/Directory.Build.props serve
# para builds locais). Publica os 7 pacotes no nuget.org e cria o GitHub Release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar (ex.: 0.1.1 ou 0.2.0-beta.1)'
        required: true
      dry_run:
        description: 'Só empacotar, sem publicar no nuget.org'
        type: boolean
        default: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: Engine.Scripting.slnx
  # Usuário do nuget.org dono da policy de Trusted Publishing (Package owner).
  NUGET_USER: AndersonN

permissions:
  contents: write   # criar o GitHub Release
  id-token: write   # OIDC para o Trusted Publishing do nuget.org

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Separa prefixo e sufixo: 0.2.0-beta.1 -> VersionPrefix=0.2.0, VersionSuffix=beta.1.
      # (usar VersionPrefix/Suffix em vez de Version permite a cada projeto manter seu próprio
      # sufixo quando precisa — ver o Extensio.Lua no repositório Extensio)
      - name: Resolver versão
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Versão inválida: '$VERSION' (esperado SemVer, ex.: 0.1.1 ou 0.2.0-beta.1)"
            exit 1
          fi
          # ATENÇÃO: só passar -p:VersionSuffix quando houver sufixo. Passá-lo VAZIO cria uma
          # global property imutável e anularia um VersionSuffix default de projeto.
          PREFIX="${VERSION%%-*}"
          case "$VERSION" in
            *-*) ARGS="-p:VersionPrefix=$PREFIX -p:VersionSuffix=${VERSION#*-}" ;;
            *)   ARGS="-p:VersionPrefix=$PREFIX" ;;
          esac
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "full=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publicando versão $VERSION (args: $ARGS)"

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore ${{ steps.version.outputs.args }}

      # Gate: nada é publicado com a suíte vermelha.
      - name: Test
        run: dotnet test ${{ env.SOLUTION }} -c Release --no-build

      - name: Pack
        run: dotnet pack ${{ env.SOLUTION }} -c Release --no-build -o artifacts/packages ${{ steps.version.outputs.args }}

      - name: Conferir pacotes
        run: ls -lh artifacts/packages/

      - name: Upload pacotes (artifact do run)
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ steps.version.outputs.full }}
          path: artifacts/packages/*.nupkg

      # Trusted Publishing (OIDC): troca o token do GitHub Actions por uma API key EFÊMERA do
      # nuget.org — sem secret de longa duração para rotacionar. Exige a policy cadastrada em
      # nuget.org (Package owner + este repositório + release.yml) e 'id-token: write' acima.
      - name: Login no nuget.org (OIDC)
        if: github.event_name == 'push' || inputs.dry_run == false
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}

      - name: Publicar no nuget.org
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Criar GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/packages/*.nupkg \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
